name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned ComfyUI qualification dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          python -m pip install -r .github/requirements-content-ci.txt

      - name: Fetch pinned qualification evidence
        shell: bash
        run: |
          git clone --depth 1 --branch v0.32.0 https://github.com/Comfy-Org/ComfyUI.git .comfyui-source-0.32.0
          test "$(git -C .comfyui-source-0.32.0 rev-parse HEAD)" = "c2bcbecd82ec5ae66594340b395c24ef0217b238"
          git init .frontend-source-1.48.7
          git -C .frontend-source-1.48.7 remote add origin https://github.com/Comfy-Org/ComfyUI_frontend.git
          git -C .frontend-source-1.48.7 fetch --depth 1 origin 6d6af63c00f132cd25dc29307fc56bd2c094fa22
          git -C .frontend-source-1.48.7 checkout --detach FETCH_HEAD
          mkdir -p .upstream-cache
          python -m pip download --no-deps --dest .upstream-cache comfyui-embedded-docs==0.5.9 comfyui-workflow-templates-json==0.1.42

      - name: Validate catalog and run Python self-tests
        run: python tools/catalog.py ci --fail-on-skip

      - name: Test packaging contract
        run: python -m unittest discover -s tests -v

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test -- --run

      - name: Build frontend
        run: npm run build

      - name: Verify generated catalog is current
        run: python tools/catalog.py build --check

      - name: Verify required release files
        shell: bash
        run: |
          test -s web/nodes-wizard.js
          test -s web/data/catalog.json
          test -s web/data/search-index.json
          test -s web/README.md
          test -s LICENSE
          test -s LICENSE-CONTENT

      - name: Verify clean generated state
        run: git diff --exit-code
