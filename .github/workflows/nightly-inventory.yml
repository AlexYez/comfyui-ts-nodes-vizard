name: Nightly upstream inventory

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      comfyui_ref:
        description: "ComfyUI git ref, or latest-stable"
        required: false
        default: "latest-stable"

permissions:
  contents: read

concurrency:
  group: nightly-upstream-inventory
  cancel-in-progress: true

jobs:
  validate-current-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Nodes Wizard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate checked-in catalog
        run: python tools/catalog.py ci

  upstream-inventory:
    # Upstream dependency installation can fail independently of Nodes Wizard.
    # The artifact and job log remain a signal; this job never writes to the repo.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Nodes Wizard
        uses: actions/checkout@v4
        with:
          path: wizard

      - name: Resolve ComfyUI ref
        id: comfy-ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.comfyui_ref || 'latest-stable' }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_REF" != "latest-stable" ]]; then
            ref="$REQUESTED_REF"
          else
            ref="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Comfy-Org/ComfyUI/releases/latest \
              | jq --raw-output '.tag_name')"
          fi
          test -n "$ref"
          test "$ref" != "null"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          artifact_key="$(printf '%s' "$ref" | tr '/:' '--')"
          echo "artifact-key=$artifact_key" >> "$GITHUB_OUTPUT"

      - name: Check out clean ComfyUI
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ steps.comfy-ref.outputs.ref }}
          path: comfyui
          persist-credentials: false

      - name: Set up Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: comfyui/requirements.txt

      - name: Install CPU runtime dependencies
        working-directory: comfyui
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          python -m pip install --requirement requirements.txt

      - name: Start clean local ComfyUI
        id: start-comfy
        shell: bash
        working-directory: comfyui
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/nodes-wizard-inventory"
          mkdir -p "$report_dir"
          python main.py \
            --cpu \
            --disable-all-custom-nodes \
            --disable-auto-launch \
            --listen 127.0.0.1 \
            --port 8188 \
            >"$report_dir/comfyui.log" 2>&1 &
          echo "$!" > "$report_dir/comfyui.pid"
          echo "report-dir=$report_dir" >> "$GITHUB_OUTPUT"

      - name: Wait for local API
        shell: bash
        run: |
          set -euo pipefail
          pid="$(cat "$RUNNER_TEMP/nodes-wizard-inventory/comfyui.pid")"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8188/system_stats >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/nodes-wizard-inventory/comfyui.log"
              exit 1
            fi
            sleep 2
          done
          echo "ComfyUI did not become ready within 180 seconds" >&2
          exit 1

      - name: Capture upstream inventory
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/nodes-wizard-inventory"
          curl --fail --silent --show-error --retry 3 \
            http://127.0.0.1:8188/object_info \
            --output "$report_dir/object-info.json"
          curl --fail --silent --show-error --retry 3 \
            http://127.0.0.1:8188/api/node_replacements \
            --output "$report_dir/node-replacements.json"
          curl --fail --silent --show-error --retry 3 \
            http://127.0.0.1:8188/system_stats \
            --output "$report_dir/system-stats.json"
          printf '%s\n' '${{ steps.comfy-ref.outputs.ref }}' \
            > "$report_dir/comfyui-ref.txt"

      - name: Build inventory, diff, and coverage reports
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/nodes-wizard-inventory"
          baseline="$(find wizard/content/runtime -type f -name '*.object-info*.json' | sort | tail -n 1)"
          if [[ -z "$baseline" ]]; then
            echo "No checked-in object_info baseline found" >&2
            exit 1
          fi
          python wizard/tools/catalog.py inventory-report \
            --object-info "$report_dir/object-info.json" \
            --replacements "$report_dir/node-replacements.json" \
            --system-stats "$report_dir/system-stats.json" \
            --baseline "$baseline" \
            --output-dir "$report_dir"
          python wizard/tools/catalog.py coverage \
            --inventory "$report_dir/object-info.json" \
            > "$report_dir/coverage-summary.json"

      - name: Stop local ComfyUI
        if: always() && steps.start-comfy.outcome == 'success'
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/nodes-wizard-inventory/comfyui.pid"
          if [[ -f "$pid_file" ]]; then
            pid="$(cat "$pid_file")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi

      - name: Upload inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-inventory-${{ steps.comfy-ref.outputs.artifact-key }}
          path: ${{ runner.temp }}/nodes-wizard-inventory
          if-no-files-found: warn
          retention-days: 14
