name: Publish to ComfyUI Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require the tag to match the package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned ComfyUI qualification dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          python -m pip install -r .github/requirements-content-ci.txt

      - name: Fetch pinned qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          git -c core.autocrlf=true clone --depth 1 --branch v0.32.0 https://github.com/Comfy-Org/ComfyUI.git .comfyui-source-0.32.0
          test "$(git -C .comfyui-source-0.32.0 rev-parse HEAD)" = "c2bcbecd82ec5ae66594340b395c24ef0217b238"
          git init .frontend-source-1.48.7
          git -C .frontend-source-1.48.7 config core.autocrlf true
          git -C .frontend-source-1.48.7 remote add origin https://github.com/Comfy-Org/ComfyUI_frontend.git
          git -C .frontend-source-1.48.7 fetch --depth 1 origin 6d6af63c00f132cd25dc29307fc56bd2c094fa22
          git -C .frontend-source-1.48.7 checkout --detach FETCH_HEAD
          mkdir -p .upstream-cache
          python -m pip download --no-deps --dest .upstream-cache comfyui-embedded-docs==0.5.9 comfyui-workflow-templates-json==0.1.42

      - name: Validate catalog and packaging
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/qualification:${{ github.workspace }}/.comfyui-source-0.32.0
        run: |
          python tools/catalog.py ci --fail-on-skip
          python -m unittest discover -s tests -v

      - name: Test and build frontend
        run: |
          npm run typecheck
          npm run test -- --run
          npm run build

      - name: Verify generated release files
        shell: bash
        run: |
          python tools/catalog.py build --check
          test -s web/nodes-wizard.js
          test -s web/data/catalog.json
          test -s web/data/search-index.json
          test -s LICENSE
          test -s LICENSE-CONTENT
          git diff --exit-code

      - name: Qualify browser performance behavior
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

  publish:
    name: Publish package
    needs: qualify
    runs-on: ubuntu-latest
    environment: comfyui-registry
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Registry token
        shell: bash
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: test -n "$REGISTRY_ACCESS_TOKEN"

      - name: Publish to ComfyUI Registry
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
