[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-ts-nodes-vizard"
version = "0.1.0-alpha.1"
description = "Client-side Russian reference for ComfyUI nodes"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSE-CONTENT"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
packages = []
include-package-data = true

[tool.comfy]
PublisherId = "REPLACE_WITH_REGISTRY_PUBLISHER_ID"
DisplayName = "TS Nodes Wizard"
requires-comfyui = ">=0.32.0"
includes = ["web"]
