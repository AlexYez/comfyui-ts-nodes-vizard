[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-ts-nodes-vizard"
version = "0.3.2"
description = "Client-side Russian reference for ComfyUI nodes"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSE-CONTENT"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/AlexYez/comfyui-ts-nodes-vizard"
Documentation = "https://github.com/AlexYez/comfyui-ts-nodes-vizard#readme"
Issues = "https://github.com/AlexYez/comfyui-ts-nodes-vizard/issues"

[tool.setuptools]
packages = []
include-package-data = true

[tool.comfy]
PublisherId = "timesaver"
DisplayName = "TS Nodes Wizard"
Icon = "https://raw.githubusercontent.com/AlexYez/comfyui-ts-nodes-vizard/refs/heads/main/icon.png"
requires-comfyui = ">=0.32.0"
includes = ["web"]
